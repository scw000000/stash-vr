query Version{
    version {
        version
    }
}

query UIConfiguration{
    configuration{
        ui
    }
}

query FindCredentials{
    configuration {
        general {
            username, password
        }
    }
}

query FindSavedSceneFilters{
    findSavedFilters(mode: SCENES){
        ...SavedFilterParts
    }
}

query FindTags(
    $tag_filter: TagFilterType, $sort: String, $direction: SortDirectionEnum){
    findTags(tag_filter: $tag_filter, filter: {sort: $sort, direction: $direction, per_page: -1}){
        tags {
            ...TagParts
            scene_count
        }}
}

query FindTagByName($name: String!){
    findTags(tag_filter: {name: {value: $name, modifier: EQUALS}}){tags {
        id
    }}
}

query FindStudioByName($name: String!){
    findStudios(studio_filter: {name: {value: $name, modifier: EQUALS}}){studios {
        id
    }}
}

query FindPerformerByName($name: String!){
    findPerformers(performer_filter: {name: {value: $name, modifier: EQUALS}}){performers {
        id
    }}
}

query FindSceneIdsByFilter(
    $scene_filter: SceneFilterType, $filterOpts: FindFilterType){
    findScenes(scene_filter: $scene_filter, filter: $filterOpts){
        count
        scenes {
            id
        }}
}

query FindAllSceneIds{
    findScenes(filter: {per_page: -1}){
        scenes {
            id
        }}
}

query FindScenes($scene_ids: [Int!]){
    findScenes(scene_ids: $scene_ids){
        scenes {
            ...SceneParts
        }
    }
}

query FindScenesForFacetIndex {
    findScenes(filter: {per_page: -1}) {
        scenes {
            id
            rating100
            o_counter
            studio { id }
            performers { id }
            tags { id sort_name }
        }
    }
}

query FindSceneMarkers($scene_id: ID!){
    findSceneMarkers(scene_marker_filter: {scenes: {value: [$scene_id] modifier: EQUALS}}){
        scene_markers {
            ...SceneMarkerParts
        }
    }
}

query FindSceneTags($scene_id: ID!){
    findScene(id:$scene_id){
        ...TagPartsArray
    }
}

query IsSceneOrganized($id: ID){
    findScene(id:$id){
        organized
    }
}

query FindAllTags{
    findTags(filter:{per_page:-1}){tags {
        ...TagParts
    }}
}

query FindSampleSceneCover{
    findScenes(
        filter: { per_page: 1, sort: "random" }
        scene_filter: { NOT: { is_missing: "cover" } }
    ) {
        scenes {
            paths {
                screenshot
            }
        }
    }
}

query FindAllStudiosWithCount{
    findStudios(filter: {sort: "scenes_count", direction: DESC, per_page: -1}){
        studios {
            id, name
            scene_count
        }
    }
}

query FindPerformersWithSceneCount(
    $min_scene_count: Int!, $per_page: Int!){
    findPerformers(
        performer_filter: {scene_count: {value: $min_scene_count, modifier: GREATER_THAN}} # GREATER_THAN_OR_EQUAL not in schema; caller passes min_scene_count - 1
        filter: {sort: "scenes_count", direction: DESC, per_page: $per_page}
    ){
        performers {
            id, name
            scene_count
        }
    }
}

query FindPerformersByIDs($ids: [ID!]!){
    findPerformers(ids: $ids){
        performers {
            id, name
        }
    }
}

query FindTagsByIDs($ids: [ID!]!){
    findTags(ids: $ids){
        tags {
            id, name
        }
    }
}

fragment SavedFilterParts on SavedFilter{
    id, name, mode, find_filter {sort, direction}, object_filter
}


fragment SceneParts on Scene{
    id, title, rating100, created_at, date
    files{basename, duration, path, height, video_codec}
    studio{
        id
        name
    },
    scene_markers {
        ...SceneMarkerParts
    },
    performers {
        id
        name
    },
    groups {
        group {
            name
        }
    }
    play_count,
    o_counter,
    organized
    paths{screenshot, preview, sprite, stream funscript interactive_heatmap caption},
    sceneStreams{url, mime_type, label}
    captions {
        caption_type language_code
    }

    interactive
    ...TagPartsArray
}

fragment SceneMarkerParts on SceneMarker{
    id, seconds, end_seconds, title, primary_tag {
        id, name
    }
}

fragment TagPartsArray on Scene{
    tags {
        ...TagParts
    }
}


fragment TagParts on Tag{
    id,name,
    # @genqlient(pointer: false)
    sort_name
    aliases
    parents {
        id name
        # @genqlient(pointer: false)
        sort_name
    }
}
